{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Nova Transação</h2>
    
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" name="descricao" class="form-control" placeholder="Ex: Mercado, Aluguel..." required>
        </div>

        <div class="mb-3">
            <label class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" name="valor" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="categoria_id" class="form-label">Categoria</label>
            <select name="categoria_id" id="categoria_id" class="form-select" required>
                <option value="" disabled selected>Selecione uma categoria</option>
                {% for c in categorias %}
                    <option value="{{ c.id }}">{{ c.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select">
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Salvar Transação</button>
        <a href="{{ url_for('transacoes.lista') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
