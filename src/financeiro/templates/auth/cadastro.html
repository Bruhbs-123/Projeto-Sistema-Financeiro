{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow border-0 mt-5" style="border-radius: 15px;">
            <div class="card-body p-4">
                <h2 class="text-center mb-4" style="color: #333; font-weight: 600;">Criar Conta</h2>
                
                <form action="{{ url_for('auth.cadastro') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Nome Completo</label>
                        <input type="text" name="nome" class="form-control" placeholder="Seu nome aqui" required style="border-radius: 10px;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary">E-mail</label>
                        <input type="email" name="email" class="form-control" placeholder="email@exemplo.com" required style="border-radius: 10px;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary">Senha</label>
                        <input type="password" name="senha" class="form-control" placeholder="Crie uma senha" required style="border-radius: 10px;">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2" style="background-color: #8a05be; border: none; border-radius: 20px; font-weight: 500;">
                        Cadastrar
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <small class="text-muted">Já tem conta? <a href="#" class="text-decoration-none" style="color: #8a05be;">Fazer Login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
