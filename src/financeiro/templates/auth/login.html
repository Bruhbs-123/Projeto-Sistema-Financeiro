{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card">
            <h4 class="fw-bold mb-1">Entrar na sua conta</h4>
            <p class="text-muted mb-4" style="font-size: 0.9rem;">Bem-vinda de volta 👋</p>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label fw-500">E-mail</label>
                    <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-500">Senha</label>
                    <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Entrar
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted mb-0" style="font-size: 0.9rem;">
                Não tem conta? 
                <a href="{{ url_for('auth.cadastro') }}" style="color: var(--nu-purple); font-weight: 600;">Cadastre-se</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
